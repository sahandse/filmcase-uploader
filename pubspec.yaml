name: filmcase_uploader
description: Persian Android uploader for Filmcase and Boxera
publish_to: 'none'
version: 1.5.2+9

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.3.0
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

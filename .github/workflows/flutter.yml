name: Flutter Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org ir.filmcase --project-name filmcase_uploader --no-pub .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format lib

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: filmcase-uploader-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Rename APK for GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build/app/outputs/flutter-apk/app-release.apk "filmcase-uploader-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "filmcase-uploader-${GITHUB_REF_NAME}.apk" --title "Filmcase Uploader ${GITHUB_REF_NAME}" --generate-notes
